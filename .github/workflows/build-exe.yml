name: Build Windows EXE

# Runs automatically on every push to main, and can also be triggered
# manually from the "Actions" tab in GitHub ("Run workflow" button).
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the .exe with PyInstaller
        run: |
          pyinstaller --onefile --noconsole `
            --name "LTspiceToQSpiceTools" `
            --collect-all spicelib `
            combined_app.py

      - name: Upload the built .exe
        uses: actions/upload-artifact@v4
        with:
          name: LTspiceToQSpiceTools-windows-exe
          path: dist/LTspiceToQSpiceTools.exe

